<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="calculator-shell">
    <section class="calculator" aria-label="Calculator">
      <h1>My Calculator</h1>

      <section class="display-panel" aria-live="polite">
        <div class="display-meta"><span>Simple calculator is here</span><span id="operation-count">0 operations</span></div>
        <div class="expression" id="expression">&nbsp;</div>
        <output class="display-value" id="display">0</output>
      </section>

      <div class="keypad" id="keypad">
        <button class="key key-muted" data-action="clear">AC</button>
        <button class="key key-muted" data-action="sign">+/-</button>
        <button class="key key-muted" data-action="percent">%</button>
        <button class="key key-operator" data-value="÷">÷</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key key-operator" data-value="×">×</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key key-operator" data-value="−">−</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key key-operator" data-value="+">+</button>

        <button class="key key-zero" data-value="0">0</button>
        <button class="key" data-value=".">.</button>
        <button class="key key-equals" data-action="equals">=</button>
      </div>
      <footer class="calculator-footer">Use the buttons or your keyboard</footer>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
